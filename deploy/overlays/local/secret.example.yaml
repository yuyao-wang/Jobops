# Example only. This file is deliberately excluded from kustomization.yaml.
# Create the real local Secret outside Git before scaling any workload above 0.
apiVersion: v1
kind: Secret
metadata:
  name: jobops-runtime-secrets
  namespace: jobops-demo
type: Opaque
stringData:
  DATABASE_URL: replace-with-local-postgresql-url
  REDIS_URL: replace-with-local-redis-url
  POSTGRES_USER: replace-with-local-postgresql-user
  POSTGRES_PASSWORD: replace-with-local-postgresql-password
  MINIO_ROOT_USER: replace-with-local-minio-root-user
  MINIO_ROOT_PASSWORD: replace-with-local-minio-root-password
  S3_ACCESS_KEY: replace-with-local-minio-access-key
  S3_SECRET_KEY: replace-with-local-minio-secret-key
