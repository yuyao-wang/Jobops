# Example contract only. This file is deliberately excluded from kustomization.
# A production external-secret provider must create this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: jobops-runtime-secrets
  namespace: jobops-production
type: Opaque
stringData:
  DATABASE_URL: replace-with-managed-postgresql-url
  REDIS_URL: replace-with-managed-redis-url
  S3_ACCESS_KEY: replace-with-managed-object-storage-access-key
  S3_SECRET_KEY: replace-with-managed-object-storage-secret-key
