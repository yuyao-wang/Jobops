apiVersion: v1
kind: Service
metadata:
  name: jobops-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jobops-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: jobops-dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jobops-dashboard
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
