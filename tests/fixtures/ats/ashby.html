<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sanitized Ashby Fixture</title></head>
<body>
  <main>
    <form data-testid="application-form" data-ashby-application-form="true" novalidate>
      <label for="name">Full name</label><input id="name" name="name" autocomplete="name" required>
      <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
      <label for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="tel">
      <label for="location">Location</label><input id="location" name="location">
      <label for="resume">Resume</label><input id="resume" name="resume" type="file" data-testid="resume-upload" required>
      <label for="linkedin">LinkedIn</label><input id="linkedin" name="linkedin" type="url">
      <label for="authorization">Are you legally authorized to work in this location?</label>
      <select id="authorization" name="authorization" required>
        <option value="">Select</option><option value="yes">Yes</option><option value="no">No</option>
      </select>
      <button data-testid="application-submit" type="submit">Submit application</button>
    </form>
    <section data-testid="application-confirmation" data-application-id="ASHBY-SYNTHETIC" hidden>
      Application submitted. Thank you for applying.
    </section>
  </main>
  <script>
    window.fixtureSubmitCount = 0;
    document.querySelector('form').addEventListener('submit', event => {
      event.preventDefault(); window.fixtureSubmitCount += 1;
      document.querySelector('[data-testid="application-confirmation"]').hidden = false;
    });
  </script>
</body>
</html>
