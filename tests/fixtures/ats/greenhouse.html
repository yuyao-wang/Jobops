<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sanitized Greenhouse Fixture</title></head>
<body>
  <main id="application">
    <form action="/greenhouse/application" novalidate>
      <label for="first_name">First name</label>
      <input id="first_name" name="job_application[first_name]" required>
      <label for="last_name">Last name</label>
      <input id="last_name" name="job_application[last_name]" required>
      <label for="email">Email</label>
      <input id="email" name="job_application[email]" type="email" required>
      <label for="phone">Phone</label>
      <input id="phone" name="job_application[phone]" type="tel">
      <label for="resume">Resume</label>
      <input id="resume" name="job_application[resume]" type="file" required>
      <label for="linkedin">LinkedIn</label>
      <input id="linkedin" name="job_application[linkedin]" type="url">
      <label for="authorization">Are you legally authorized to work in this location?</label>
      <select id="authorization" name="question_authorization" required>
        <option value="">Select</option><option value="yes">Yes</option><option value="no">No</option>
      </select>
      <button id="submit_app" type="submit">Submit application</button>
    </form>
    <section data-jobops-review="greenhouse">Review application</section>
    <section data-jobops-confirmation="greenhouse" data-application-id="GH-SYNTHETIC" hidden>
      Thank you. Your application was submitted successfully.
    </section>
  </main>
  <script>
    window.fixtureSubmitCount = 0;
    document.querySelector('form').addEventListener('submit', event => {
      event.preventDefault(); window.fixtureSubmitCount += 1;
      document.querySelector('[data-jobops-confirmation="greenhouse"]').hidden = false;
    });
  </script>
</body>
</html>
