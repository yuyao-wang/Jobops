<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sanitized Lever Fixture</title></head>
<body>
  <main class="application-page">
    <form class="application-form" data-qa="application-form" novalidate>
      <label for="name">Full name</label><input id="name" name="name" required>
      <label for="email">Email</label><input id="email" name="email" type="email" required>
      <label for="phone">Phone</label><input id="phone" name="phone" type="tel">
      <label for="org">Current company</label><input id="org" name="org">
      <label for="resume">Resume</label><input id="resume" name="resume" type="file" required>
      <label for="linkedin">LinkedIn</label><input id="linkedin" name="urls[LinkedIn]" type="url">
      <label for="authorization">Are you legally authorized to work in this location?</label>
      <select id="authorization" name="authorization" required>
        <option value="">Select</option><option value="yes">Yes</option><option value="no">No</option>
      </select>
      <textarea name="comments" aria-label="Additional information"></textarea>
      <button data-qa="btn-submit" type="submit">Submit application</button>
    </form>
    <section data-jobops-confirmation="lever" data-application-id="LEVER-SYNTHETIC" hidden>
      Thank you. Your application was received.
    </section>
  </main>
  <script>
    window.fixtureSubmitCount = 0;
    document.querySelector('form').addEventListener('submit', event => {
      event.preventDefault(); window.fixtureSubmitCount += 1;
      document.querySelector('[data-jobops-confirmation="lever"]').hidden = false;
    });
  </script>
</body>
</html>
