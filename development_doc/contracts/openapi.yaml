openapi: 3.1.0
info:
  title: Jobops Semantic Mapper API
  version: 1.0.0
  description: |
    Proposed internal transport for the existing provider-neutral SemanticMapper
    capability. No HTTP service is implemented in V1. The API accepts only
    value-free control metadata and returns non-executable classifications.
servers:
  - url: https://semantic-mapper.jobops.internal
    description: Illustrative internal TLS endpoint; not a deployed address.
security:
  - mutualTLS: []
paths:
  /v1/map-controls:
    post:
      operationId: mapControls
      summary: Classify one bounded batch of unresolved required controls
      description: |
        The caller reserves the run's single semantic attempt before dispatch.
        Returned items are untrusted data and must be validated locally before
        any candidate value is resolved.
      parameters:
        - name: X-Request-ID
          in: header
          required: true
          description: Correlation ID only; it is not an idempotency key.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MappingBatchRequest"
      responses:
        "200":
          description: Classification completed; omitted responses are abstentions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MappingBatchResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/ValueFreePolicyViolation"
        "429":
          $ref: "#/components/responses/RateOrBudgetExceeded"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/InvalidModelOutput"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "504":
          $ref: "#/components/responses/ModelTimeout"
components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
  schemas:
    MappingBatchRequest:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - taxonomy_version
        - requests
      properties:
        schema_version:
          type: string
          const: "1.0"
        taxonomy_version:
          type: string
          const: jobops-mapping-v1
        requests:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/MappingRequest"
    MappingRequest:
      type: object
      additionalProperties: false
      required:
        - index
        - role
        - tag
        - type
        - label
        - name
        - aria_label
        - placeholder
        - autocomplete
        - required
        - options
      properties:
        index:
          type: integer
          minimum: 0
        role:
          type: string
          pattern: "^[a-z][a-z0-9_-]{0,31}$"
        tag:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,31}$"
        type:
          type: string
          maxLength: 32
        label:
          type: string
          maxLength: 240
        name:
          type: string
          maxLength: 160
        aria_label:
          type: string
          maxLength: 240
        placeholder:
          type: string
          maxLength: 160
        autocomplete:
          type: string
          maxLength: 80
        required:
          type: boolean
          const: true
        options:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 160
      anyOf:
        - properties:
            label:
              minLength: 1
        - properties:
            name:
              minLength: 1
        - properties:
            aria_label:
              minLength: 1
        - properties:
            placeholder:
              minLength: 1
        - properties:
            autocomplete:
              minLength: 1
        - properties:
            options:
              minItems: 1
    MappingBatchResponse:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - taxonomy_version
        - request_id
        - responses
      properties:
        schema_version:
          type: string
          const: "1.0"
        taxonomy_version:
          type: string
          const: jobops-mapping-v1
        request_id:
          type: string
          format: uuid
        responses:
          type: array
          maxItems: 40
          items:
            $ref: "./mapping-result.schema.json"
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - request_id
        - code
        - dispatch_state
      properties:
        schema_version:
          type: string
          const: "1.0"
        request_id:
          type: string
          format: uuid
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - REQUEST_TOO_LARGE
            - VALUE_FREE_POLICY_VIOLATION
            - AUTHENTICATION_FAILED
            - NOT_AUTHORIZED
            - BUDGET_EXCEEDED
            - RATE_LIMITED
            - INVALID_MODEL_OUTPUT
            - PROVIDER_UNAVAILABLE
            - MODEL_TIMEOUT
            - INTERNAL_ERROR
        dispatch_state:
          type: string
          enum:
            - NOT_DISPATCHED
            - UNKNOWN
            - COMPLETED
  responses:
    InvalidRequest:
      description: The request violates schema or batch invariants.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  code:
                    const: INVALID_REQUEST
                  dispatch_state:
                    const: NOT_DISPATCHED
    AuthenticationFailed:
      description: The service identity is missing or invalid.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  code:
                    const: AUTHENTICATION_FAILED
                  dispatch_state:
                    const: NOT_DISPATCHED
    NotAuthorized:
      description: The authenticated caller cannot use this operation.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  code:
                    const: NOT_AUTHORIZED
                  dispatch_state:
                    const: NOT_DISPATCHED
    RequestTooLarge:
      description: The request exceeds the 64 KiB body limit.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  code:
                    const: REQUEST_TOO_LARGE
                  dispatch_state:
                    const: NOT_DISPATCHED
    ValueFreePolicyViolation:
      description: The request appears to contain forbidden private or secret data.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  code:
                    const: VALUE_FREE_POLICY_VIOLATION
                  dispatch_state:
                    const: NOT_DISPATCHED
    RateOrBudgetExceeded:
      description: The caller rate or model budget is exhausted.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  code:
                    enum:
                      - BUDGET_EXCEEDED
                      - RATE_LIMITED
                  dispatch_state:
                    const: NOT_DISPATCHED
    InternalError:
      description: The service failed without a usable classification.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  code:
                    const: INTERNAL_ERROR
                  dispatch_state:
                    const: UNKNOWN
    InvalidModelOutput:
      description: The provider completed but its output failed validation.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  code:
                    const: INVALID_MODEL_OUTPUT
                  dispatch_state:
                    const: COMPLETED
    ProviderUnavailable:
      description: Provider availability or dispatch state is uncertain.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  code:
                    const: PROVIDER_UNAVAILABLE
                  dispatch_state:
                    const: UNKNOWN
    ModelTimeout:
      description: The provider did not return within the 20 second deadline.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  code:
                    const: MODEL_TIMEOUT
                  dispatch_state:
                    const: UNKNOWN
